services:
  - type: web
    name: mazi-idika
    runtime: python
    plan: free                         # Render Free tier
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true            # Render generates a random value
      # Set these manually in the Render dashboard (never commit secrets):
      # DATABASE_URL
      # TWILIO_ACCOUNT_SID
      # TWILIO_AUTH_TOKEN
      # TWILIO_WHATSAPP_NUMBER
      # TWILIO_WEBHOOK_SECRET
      # GEMINI_API_KEY
      # OPENAI_API_KEY
      # DEEPGRAM_API_KEY
      # SUPABASE_URL
      # SUPABASE_ANON_KEY
      # SUPABASE_SERVICE_ROLE_KEY
